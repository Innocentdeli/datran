[package]
name = "datran"
version = "1.4.0"
description = "Datran Sovereign - Warp-speed P2P sharing."
authors = ["titan"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5" }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "system-tray", "clipboard-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
bundle = ["tauri/bundle"]
