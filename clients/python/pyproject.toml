[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "datran-client"
version = "0.1.0"
description = "Client for the Datran core reactor (compression data plane, evolution status, chunked object store). Stdlib only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
datran_client = ["py.typed"]
