# Datran production stack: Caddy (HTTP/3 + HTTP/2 + automatic TLS) -> Next.js app -> Rust reactor.
#
#   cp deploy/.env.example deploy/.env   # fill in secrets
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# Only Caddy publishes ports. The app, the reactor, PostgreSQL and Redis are reachable only on the internal
# network (their ports are never published).
#
# Redis holds the app's cross-instance state (rate limits, single-use login tokens, WebAuthn
# challenges, swarm signaling, upload progress, job locks). With it, `app` can be scaled out:
#   docker compose ... up -d --scale app=3   (Caddy load-balances over the replicas)

name: datran

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"          # ACME HTTP-01 challenge + redirect to HTTPS
      - "443:443/tcp"    # HTTP/1.1 + HTTP/2 over TLS
      - "443:443/udp"    # HTTP/3 over QUIC
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS (public DNS name)}
      APP_HOST: app
      APP_PORT: ${APP_PORT:-3000}
      INGEST_MAX_BODY: ${INGEST_MAX_BODY:-201MiB}
      DEFAULT_MAX_BODY: ${DEFAULT_MAX_BODY:-16MiB}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/app.caddy:/etc/caddy/app.caddy:ro
      - caddy-data:/data        # certificates + ACME account (keep!)
      - caddy-config:/config
    networks: [edge]

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    restart: unless-stopped
    depends_on:
      reactor:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file: .env
    # Apply pending database migrations (advisory-locked, so concurrent replicas are safe), then serve.
    # A failed migration exits non-zero before the server starts; nothing is ever dropped or reset.
    command:
      - sh
      - -c
      - npm run --silent db:migrate && exec node_modules/.bin/next start -H "$$HOSTNAME" -p "$$PORT"
    environment:
      NODE_ENV: production
      PORT: ${APP_PORT:-3000}
      HOSTNAME: 0.0.0.0
      TRUST_PROXY: "true"                    # Caddy overwrites X-Forwarded-For
      REACTOR_URL: http://reactor:3005
      REACTOR_STATE_DIR: /data/reactor-state # TS fallback reads zstd dictionaries from here
      DIOCOM_STORAGE_PATH: /data/app/storage
      # PostgreSQL is mandatory in production (no JSON fallback). Default: the bundled `postgres` service;
      # set DATABASE_URL in .env to use an external server instead.
      DATABASE_URL: ${DATABASE_URL:-postgres://datran:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/datran}
      # Shared state for multiple app instances (src/lib/kv). REQUIRE_REDIS makes a missing URL fatal.
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
      REQUIRE_REDIS: "true"
      # Observability (diocom-app/src/lib/observability). METRICS_TOKEN unset disables GET /api/metrics.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-diocom-app}
    # Readiness: DB reachable + migrated, Redis reachable (and the reactor when STORAGE_BACKEND=reactor).
    # start_period covers `db:migrate` + Next.js boot. Liveness without dependencies: /api/health/live.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health/ready',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    expose:
      - "${APP_PORT:-3000}"
    volumes:
      - app-data:/data/app
      - reactor-state:/data/reactor-state:ro
    networks: [edge, internal]

  reactor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.reactor
    restart: unless-stopped
    environment:
      REACTOR_PORT: 3005
      # Binding beyond loopback (needed inside the container network) requires both tokens.
      REACTOR_BIND: 0.0.0.0
      REACTOR_TOKEN: ${REACTOR_TOKEN:?set REACTOR_TOKEN}
      REACTOR_CLUSTER_TOKEN: ${REACTOR_CLUSTER_TOKEN:?set REACTOR_CLUSTER_TOKEN}
      REACTOR_STATE_DIR: /data/reactor-state
      REACTOR_PEERS: ${REACTOR_PEERS:-}
      REACTOR_TLS_CERT: ${REACTOR_TLS_CERT:-}
      REACTOR_TLS_KEY: ${REACTOR_TLS_KEY:-}
      REACTOR_TLS_CA: ${REACTOR_TLS_CA:-}
    # No `ports:` on purpose: the reactor API is internal. Multi-node clusters connect
    # reactors directly with their own TLS (REACTOR_TLS_*); publish 3005 only on a private
    # interface for that, never through Caddy.
    expose:
      - "3005"
    volumes:
      - reactor-state:/data/reactor-state
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Ephemeral state only (everything has a TTL of minutes): persistence off. noeviction: when full,
    # writes fail and the app fails closed (e.g. rate limits refuse) instead of silently dropping limits.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No `ports:`: internal network only.
    expose:
      - "6379"
    networks: [internal]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: datran
      POSTGRES_DB: datran
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datran -d datran"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No `ports:`: internal network only. Back up the volume (or pg_dump) — it holds all metadata.
    expose:
      - "5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [internal]

  # --- Optional observability profile -------------------------------------------------------------------
  #   docker compose -f deploy/docker-compose.yml --env-file deploy/.env --profile observability up -d
  # Prometheus scrapes EVERY app replica (DNS service discovery on `app`) with METRICS_TOKEN; Grafana is
  # published on 127.0.0.1 only (tunnel to it, e.g. ssh -L 3001:127.0.0.1:3001 host). Neither is exposed via Caddy.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    restart: unless-stopped
    depends_on: [app]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - source: metrics_token
        target: metrics_token
    expose:
      - "9090"
    networks: [internal, observability]

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [observability]
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Set it in .env (not enforced with :? because compose interpolates inactive profiles too).
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    networks: [observability]

networks:
  edge: {}
  internal:
    internal: true   # no route to the internet from the reactor network
  observability: {}  # Grafana <-> Prometheus only

secrets:
  # Bearer token Prometheus sends to /api/metrics (same value as the app's METRICS_TOKEN).
  metrics_token:
    environment: METRICS_TOKEN

volumes:
  caddy-data: {}
  caddy-config: {}
  app-data: {}
  reactor-state: {}
  db-data: {}
  prometheus-data: {}
  grafana-data: {}
