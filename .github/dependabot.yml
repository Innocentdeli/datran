version: 2
updates:
  # Rust
  - package-ecosystem: cargo
    directories:
      - /core-reactor
      - /clients/rust
      - /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  # npm
  - package-ecosystem: npm
    directories:
      - /
      - /diocom-app
      - /clients/typescript
      - /diocom-mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # GitHub Actions (workflows pin major versions)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Docker base images (deploy/Dockerfile.app, deploy/Dockerfile.reactor)
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
