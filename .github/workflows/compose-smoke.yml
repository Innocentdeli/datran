# Docker compose smoke test: builds the app + reactor images, starts them on the compose
# networks (Caddy is skipped: it needs a public DNS name for ACME), waits for health and probes
# both services from inside the network. Kept separate from CI because it is slow (two full
# image builds); it runs on main, on PRs touching the deploy/runtime code, and on demand.
name: Compose smoke

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - deploy/**
      - core-reactor/**
      - diocom-app/**
      - src/**
      - package.json
      - package-lock.json
      - .github/workflows/compose-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: compose up + health
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE: docker compose -f deploy/docker-compose.yml --env-file deploy/.env
    steps:
      - uses: actions/checkout@v5

      - name: write deploy/.env with throwaway secrets
        run: |
          gen() { openssl rand -base64 32 | tr '+/' '-_' | tr -d '='; }
          {
            echo "SITE_ADDRESS=localhost"
            echo "APP_PORT=3000"
            echo "NEXTAUTH_URL=http://localhost:3000"
            echo "WEBAUTHN_RP_ID=localhost"
            echo "WEBAUTHN_ORIGIN=http://localhost:3000"
            echo "DIOCOM_SECRET=$(gen)"
            echo "DATABASE_URL="
            echo "MAX_UPLOAD_BYTES=209715200"
            echo "STORAGE_BACKEND=reactor"
            echo "REACTOR_TOKEN=$(gen)"
            echo "REACTOR_CLUSTER_TOKEN=$(gen)"
          } > deploy/.env

      - name: compose build
        run: $COMPOSE build app reactor

      - name: compose up (wait for reactor healthcheck)
        run: $COMPOSE up -d --wait --wait-timeout 180 app reactor

      - name: reactor /health (inside reactor container)
        run: $COMPOSE exec -T reactor curl -fsS http://127.0.0.1:3005/health

      - name: reactor /health from the app container (internal network)
        run: |
          $COMPOSE exec -T app node -e "fetch('http://reactor:3005/health').then(r=>{console.log(r.status);process.exit(r.ok?0:1)}).catch(e=>{console.error(e);process.exit(1)})"

      - name: app responds
        run: |
          for _ in $(seq 1 30); do
            if $COMPOSE exec -T app node -e "fetch('http://127.0.0.1:3000/',{redirect:'manual'}).then(r=>{console.log(r.status);process.exit(r.status<500?0:1)}).catch(()=>process.exit(1))"; then
              exit 0
            fi
            sleep 2
          done
          echo "app did not respond with a non-5xx status"
          exit 1

      - name: logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail 200 app reactor

      - name: compose down
        if: always()
        run: $COMPOSE down -v --remove-orphans
